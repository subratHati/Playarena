# Render Blueprint for the MivoPlay API.
# Render → New → Blueprint → pick this repo. You'll be asked for the values marked sync: false.
# The build runs from the repo root because the server imports ../shared.
services:
  - type: web
    name: playarena-api
    runtime: node
    plan: starter # free instances sleep when idle, which drops live matches
    region: singapore
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TIMEZONE
        value: Asia/Kolkata
      - key: REMINDER_MINUTES
        value: 30
      - key: ENABLE_MATCHMAKING
        value: 0
      - key: CHECKIN_OPENS_MINUTES
        value: 15
      - key: NO_SHOW_SECONDS
        value: 60
      - key: RECONNECT_SECONDS
        value: 30
      # Payment gateways (see DEPLOY.md §9). Leave a gateway's keys empty to hide it at checkout.
      - key: API_PUBLIC_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      - key: PHONEPE_CLIENT_ID
        sync: false
      - key: PHONEPE_CLIENT_SECRET
        sync: false
      - key: PHONEPE_CLIENT_VERSION
        value: 1
      - key: PHONEPE_ENV
        value: sandbox
      - key: PHONEPE_WEBHOOK_USERNAME
        sync: false
      - key: PHONEPE_WEBHOOK_PASSWORD
        sync: false
